# Add this include inside the existing HTTPS server for this domain.
# Existing /api/, /assets/, /uploads/, /wa/ and policy/support routes remain intact.
location = / {
    include /etc/nginx/snippets/iconic-website-proxy.conf;
}
location = /iconic-api {
    include /etc/nginx/snippets/iconic-website-proxy.conf;
}
location ^~ /iconic-api/ {
    include /etc/nginx/snippets/iconic-website-proxy.conf;
}
location ^~ /iconic-assets/ {
    include /etc/nginx/snippets/iconic-website-proxy.conf;
}
location ^~ /_blob/ {
    include /etc/nginx/snippets/iconic-website-proxy.conf;
}
location ^~ /vendor/ {
    include /etc/nginx/snippets/iconic-website-proxy.conf;
}
location ~ ^/(ar|en)(/|$) {
    include /etc/nginx/snippets/iconic-website-proxy.conf;
}
location ~ ^/(admin/?|healthz|robots\.txt|sitemap\.xml|site\.webmanifest|favicon\.svg|favicon\.ico|apple-touch-icon\.png|icon-192\.png|icon-512\.png|og-default\.png|logo\.svg|mark\.svg)$ {
    include /etc/nginx/snippets/iconic-website-proxy.conf;
}
